name: Local-only package verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/hardened-local-only'
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Regenerate lockfile and install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --silent
          tgz="$(find . -maxdepth 1 -name 'clauderipple-*.tgz' -print -quit)"
          test -n "$tgz"
          tar -tzf "$tgz" > package-contents.txt
          if grep -Ei '(^|/)(remote|relay|ripple-host)(/|[.-])|remote-tunnel|remote-host' package-contents.txt; then
            echo "::error::Remote-control files found in package"
            exit 1
          fi
          for file in package/bin/clauderipple.js package/dist/cli/src/index.js package/dist/router/src/index.js package/dist/ui/index.html; do
            grep -Fx "$file" package-contents.txt >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: local-only-package-and-lock
          path: |
            package-lock.json
            clauderipple-*.tgz
            package-contents.txt
          if-no-files-found: error
